      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="fc-icon-arrow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>
  <!-- Base badge avec coins arrondis -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#fc-icon-bg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" />
